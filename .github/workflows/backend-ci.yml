name: Backend CI

on:
  push:
    branches: [ master, main ]
    paths:
      - 'Veterinaria/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'Veterinaria/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x Veterinaria/mvnw

      - name: Compile and verify
        working-directory: ./Veterinaria
        run: ./mvnw test-compile

      - name: Run test suite
        working-directory: ./Veterinaria
        run: ./mvnw test

      - name: Build package JAR
        working-directory: ./Veterinaria
        run: ./mvnw clean package -DskipTests
