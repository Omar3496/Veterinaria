spring.application.name=Veterinaria
server.port=8081
# habilitar la pantalla de la base de datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# nombre de nuestra despensa virtual
spring.datasource.url=jdbc:h2:mem:idat_proyecto_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root
# configuracion para que el sistema cree las tablas solo
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jackson.property-naming-strategy=SNAKE_CASE
